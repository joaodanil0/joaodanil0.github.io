name: Deploy MkDocs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

steps:
  - name: Deploy na VPS
    uses: appleboy/ssh-action@v1.2.2
    with:
      host: ${{ secrets.VPS_HOST }}
      username: ${{ secrets.VPS_USER }}
      key: ${{ secrets.VPS_SSH_KEY }}
      script: |
        cd /root/mkdocs
        git pull origin main
        docker compose build
        docker compose up -d

